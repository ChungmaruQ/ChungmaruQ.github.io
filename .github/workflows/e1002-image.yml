name: E1002 dashboard images
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to publish
        type: choice
        options: [morning, evening]
        default: morning
  push:
    branches: [main]
    paths: [sensecraft/e1002-tomorrow.json]
  schedule:
    # 06:55 and 07:15 Seoul time, ahead of the 08:00 device refresh.
    - cron: '55 21 * * *'
    - cron: '15 22 * * *'

permissions:
  contents: write

concurrency:
  group: e1002-morning-image

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --package-lock=false playwright@1.56.1
          google-chrome --version
      - name: Render and publish today's image
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.image == 'morning')
        run: |
          set -euo pipefail
          file="dist/$(TZ=Asia/Seoul date +%F).png"
          node deploy/render-e1002.mjs morning "$file"
          bash deploy/publish-e1002-image.sh "$file"
      - name: Render and publish evening outlook
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.image == 'evening')
        env:
          E1002_TOMORROW_FILE: sensecraft/e1002-tomorrow.json
        run: |
          set -euo pipefail
          forecast=$(jq -er '.date | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' "$E1002_TOMORROW_FILE")
          evening=$(date -u -d "$forecast - 1 day" +%F)
          file="dist/$evening-evening.png"
          node deploy/render-e1002.mjs evening "$file"
          bash deploy/publish-e1002-image.sh "$file"
